<html lang="en">
    <head>
        <title>Ceeblue DASH Player</title>
        <meta charset="utf-8">
        <meta content="width=device-width, initial-scale=1.0, viewport-fit=cover" name="viewport">
        <meta name="color-scheme" content="light dark">

        <link rel="icon" href="./assets/ceeblue-logo-32x32.png" sizes="32x32">
        <link rel="icon" href="./assets/ceeblue-logo-192x192.png" sizes="192x192">

        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

        <link href="./css/solid.css" rel="stylesheet">
        <link href="./css/fontawesome.css" rel="stylesheet">
        <link href="./css/main.css" rel="stylesheet">

        <script>
            // Apply theme synchronously to avoid FOUC. Stored value is 'light' | 'dark'.
            (function() {
                console.log("localStorage theme:", localStorage.getItem('wrts-theme'));
                console.log("prefers-color-scheme:", matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');

                var stored = localStorage.getItem('wrts-theme') || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
                document.documentElement.dataset.theme = stored === 'dark' ? 'dark' : 'light';
            })();
        </script>
    </head>
    <body>
        <div class="shell" id="main" v-cloak>

            <header class="hdr">
                <img alt="Ceeblue" src="./assets/ceeblue-logo.png">
                <h1>
                    DASH <em>Player</em>
                </h1>
                <button class="theme-btn" :title="themeTooltip()" @click="cycleTheme()">
                    <i class="fas" :class="themeIcon()"></i>
                </button>
            </header>

            <div>

                <!-- Video -->
                <div class="player" ref="player"
                    @mouseenter="onPlayerActivity()"
                    @mousemove="onPlayerActivity()"
                    @mouseleave="onPlayerLeave()"
                    @touchstart="onPlayerTouch($event)">

                    <video autoplay id="video" ref="video" playsinline></video>

                    <!-- Hover/touch revealed controls (only while playing) -->
                    <div class="player-ctrls"
                        :class="{ 'is-active': isPlaying(), 'is-visible': controlsVisible }">
                        <button class="pc-btn pc-full"
                            :title="isFullscreen ? 'Exit fullscreen' : 'Fullscreen'"
                            @click="fullscreen()">
                            <i class="fas" :class="isFullscreen ? 'fa-compress' : 'fa-expand'"></i>
                        </button>
                        <button class="pc-btn pc-stop" title="Stop" @click="play()">
                            <i class="fas fa-stop"></i>
                        </button>
                    </div>

                    <!-- Stopped → big Play | Starting → spinner -->
                    <button class="player-action" title="Play" @click="play()" v-if="isStopped()">
                        <i class="fas fa-play"></i>
                    </button>
                    <div class="player-action is-loading" v-else-if="isStarting()">
                        <div class="ring"></div>
                    </div>

                    <div class="player-alert" v-if="streamError">
                        <i class="fas fa-exclamation-triangle"></i>
                        <div class="player-alert-body">
                            <div class="player-alert-title">
                                <span class="player-alert-type" v-if="streamError.type">{{ streamError.type }}</span>
                                <span class="player-alert-name">{{ streamError.name }}</span>
                            </div>
                            <div class="player-alert-detail" v-if="streamError.detail">{{ streamError.detail }}</div>
                        </div>
                        <button class="player-alert-x" @click="streamError = null"
                            title="Dismiss" aria-label="Dismiss">
                            <i class="fas fa-times"></i>
                        </button>
                    </div>
                </div>

                <!-- Track selects -->
                <div class="row2 gap-panel">
                    <div>
                        <span class="lbl">Video track</span>
                        <select class="sel" id="video-track-selection"
                            :disabled="!isPlaying()"
                            v-model="videoTrackId" @change="onVideoTrackChange()">
                            <option :value="undefined" :key="videoTrack">AUTO — {{ videoTrack }}</option>
                            <option v-for="[id, track] of videoTracks" :value="id">{{ track }}</option>
                        </select>
                    </div>
                    <div>
                        <span class="lbl">Audio track</span>
                        <select class="sel" id="audio-track-selection"
                            :disabled="!isPlaying()"
                            v-model="audioTrackId" @change="onAudioTrackChange()">
                            <option :value="undefined" :key="audioTrack">AUTO — {{ audioTrack }}</option>
                            <option v-for="[id, track] of audioTracks" :value="id">{{ track }}</option>
                        </select>
                    </div>
                </div>

                <!-- Stream name (full width) -->
                <div class="stream-row gap-panel">
                    <input class="inp" :disabled="!isStopped()"
                        placeholder="StreamName(?id=accessToken) or manifest URL"
                        type="text" v-model="stream" @keyup.enter="isStopped() && play()">
                </div>

                <!-- Controls -->
                <div class="ctrl-row gap-panel">
                    <button class="btn" title="Mute or unmute audio" @click="mute()">
                        <i class="fas" :class="{ 'fa-volume-up': !muted, 'fa-volume-xmark': muted }"></i>
                        {{ muted ? 'Unmute' : 'Mute' }}
                    </button>
                    <button class="btn" title="Jump to live position"
                        :class="{ 'btn-red': isBehindLive }"
                        :disabled="!isBehindLive"
                        @click="goLive()">
                        <i class="fas fa-rocket"></i>
                        Live
                    </button>
                    <button class="btn" title="Clip and download a part of this stream"
                        @click="openClip()">
                        <i class="fas fa-scissors"></i>
                        Clip
                    </button>
                </div>

                <!-- Network profile + latency target (single compact row). -->
                <div class="net-row net-latency gap-panel">
                    <div class="net-prof">
                        <span class="lbl">Network profile</span>
                        <select class="sel" v-model="netProfile" @change="setLatencyTarget()">
                            <option :value="profil" v-for="[profil, _] of netProfiles">{{ profil }}</option>
                        </select>
                    </div>
                    <div class="latency-target">
                        <span class="lbl">Target latency (ms)</span>
                        <input class="inp" type="number" min="0"
                            required oninput="validity.valid||(value='');"
                            v-model="latencyTarget" @change="setLatencyTarget(this.latencyTarget)">
                    </div>
                    <p class="net-desc" v-html="netDescription"></p>
                </div>

                <!-- Tabs -->
                <div>
                    <div class="tab-bar">
                        <button class="tab-btn" :class="{ on: activeBottomTab === 'graph' }"
                            @click="selectBottomTab('graph')">Graph</button>
                        <button class="tab-btn" :class="{ on: activeBottomTab === 'messages' }"
                            @click="selectBottomTab('messages')">
                            Messages
                            <span class="tab-badge" v-if="unreadMessages > 0">{{ unreadMessages }}</span>
                        </button>
                    </div>

                    <div class="tab-body">
                        <!-- Graph -->
                        <div v-show="activeBottomTab === 'graph'">
                            <ul class="stats-list" ref="stats"></ul>
                            <div class="stats-actions" v-show="hasMetrics">
                                <img alt="Reset" title="Reset incremental metrics and rescale the chart"
                                    @click="resetMetrics()" src="./assets/reload.png">
                                <img alt="Download CSV" title="Download metrics as a CSV file"
                                    @click="downloadStats()" src="./assets/download.png">
                                <img alt="Dump media" title="Dump media as MP4 files"
                                    @click="dump()" src="./assets/dump.png"
                                    v-show="audioDump || videoDump">
                            </div>
                        </div>

                        <!-- Messages -->
                        <div v-show="activeBottomTab === 'messages'">
                            <div class="msg-box" ref="messagesPanel">
                                <div class="msg-empty" v-if="messages.length === 0">No data messages received yet.</div>
                                <div v-for="(message, idx) in messages" :key="idx" class="msg-row">
                                    <span class="msg-track">[{{ message.track }}]</span>
                                    <span class="msg-time"> {{ message.receivedAt }} </span>{{ message.text }}
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Clip editor: clip-editor.html embedded as-is, it only needs the manifest URL -->
            <div class="modal-back" v-if="clipSrc"></div>
            <div class="modal-wrap" v-if="clipSrc" @click.self="closeClip()">
                <div class="modal-box modal-clip">
                    <button class="clip-x" title="Close the clip editor" @click="closeClip()">
                        <i class="fas fa-times"></i>
                    </button>
                    <iframe class="clip-frame" title="Clip editor" allow="fullscreen" :src="clipSrc"></iframe>
                </div>
            </div>

            <!-- #main -->
        </div>
        <!-- .shell -->
    </body>
    <script type="module">
        import { utils } from "../dist/wrts-client.bundle.js";
        import { MediaPlayer } from "../node_modules/dashjs/dist/modern/esm/dash.all.min.js";
        import { createApp } from 'https://cdn.jsdelivr.net/npm/vue@3/dist/vue.esm-browser.prod.js';
        const { EpochTime, Util, NetAddress, LogLevel, log, UIMetrics, ByteRate } = utils;

        log.level = LogLevel.INFO;

        const options = Util.options();

        const PlayState = {
            PLAYING: 'PLAYING',
            STARTING: 'STARTING',
            STOPPED: 'STOPPED'
        };

        const THEME_CYCLE = ['light', 'dark'];

        // Media-time step, in seconds, above which a poll is a discontinuity rather than playback.
        // Matches dash.js streaming.gaps.threshold: it never jumps a gap smaller than that, so
        // nothing real is missed and playback-rate sampling noise never accumulates.
        const DISCONTINUITY_THRESHOLD = 0.3;

        // Latency drift, in ms, above the target beyond which catch-up won't reasonably recover
        // and only a seek to live will: that's when the Live button becomes actionable.
        const LIVE_DRIFT_THRESHOLD = 500;

        // The vod manifest URL the clipper opens. If null, the clipper uses the current stream's manifest URL.
        const CLIP_MANIFEST_URL = null;

        createApp({
            data() {
                return {
                    playState: PlayState.STOPPED,
                    stream: '',
                    muted: false,
                    host: null,
                    player: /** @type {import('dashjs').MediaPlayerClass | null} */ (null),
                    latency: 0,
                    latencyTarget: 0,
                    // Off-screen frame grab, EpochTime decodes the e2e timestamp from its pixels
                    canvas: document.createElement('canvas'),
                    netDescription: "",
                    activeBottomTab: 'graph',
                    // No data-message source yet on the DASH side, the panel stays empty
                    messages: [],
                    unreadMessages: 0,
                    stats: new Map(),
                    uiStats: null,
                    hasMetrics: false,
                    // Local and media time of each sample, first two columns of the CSV export
                    times: [],
                    // Incremental metrics, fed by the player events and reset on each play
                    stalls: 0,
                    // Targets are a latency from the live edge, not a buffer size. The stream is delivered
                    // progressively (availabilityTimeComplete="false"), so media arrives continuously and
                    // the floor is set by delivery jitter, not by the segment duration: 1000ms holds on a
                    // good network, each step adds margin for a longer hiccup. Without progressive
                    // delivery the floor rises to a full segment and 'manifest target' is the safe choice.
                    netProfiles: new Map([
                        ['-manual-', [
                            "Manually configure a latency target high enough to absorb the variations caused by network fluctuations.",
                        ]],
                        ['manifest target', [
                            "Follow the latency target advertised by the manifest (ServiceDescription/@suggestedPresentationDelay), like the dash.js reference player.",
                        ]],
                        ['ideal', [
                            "Ideal network conditions for low latency: streamer and player are geographically close with minimal intermediary hops.",
                            1000
                        ]],
                        ['normal', [
                            "A stable and reliable network between streamer and player, making their geographical distance negligible.",
                            1500
                        ]],
                        ['distant', [
                            "Streamer and player are significantly distant and/or the connection involves multiple intermediaries (e.g., VPNs, CDN providers).",
                            2500
                        ]],
                        ['unstable', [
                            "A resilient configuration designed for maximum stability even on challenging networks, prioritizing robustness over low latency.",
                            3500
                        ]],
                    ]),
                    netProfile: 'manifest target',
                    videoTracks: new Map(),
                    videoTrack: 'Video',
                    videoTrackId: undefined,
                    audioTracks: new Map(),
                    audioTrack: 'Audio',
                    audioTrackId: undefined,
                    streamError: null,
                    theme: localStorage.getItem('wrts-theme') || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'),
                    controlsVisible: false,
                    _controlsTimer: null,
                    isFullscreen: false,
                    // Iframe src while the clip modal is open, null when closed: also the open flag
                    clipSrc: null
                }
            },
            mounted() {
                const host = options.host;
                this.host = new NetAddress(host || location.host, 443);
                this.stream = options.stream || '';
                this.setLatencyTarget(Number(options.latencyTarget));

                // React to system theme changes
                this._mql = matchMedia('(prefers-color-scheme: dark)');
                this._mqlListener = () => { this.applyTheme(true); };
                this._mql.addEventListener('change', this._mqlListener);

                this._fsListener = () => {
                    this.isFullscreen = Boolean((document.fullscreenElement || document.webkitFullscreenElement));
                };
                document.addEventListener('fullscreenchange', this._fsListener);
                document.addEventListener('webkitfullscreenchange', this._fsListener);
                this.$refs.video.addEventListener('webkitbeginfullscreen', () => { this.isFullscreen = true; });
                this.$refs.video.addEventListener('webkitendfullscreen', () => { this.isFullscreen = false; });

                const drawContext = this.canvas.getContext('2d');

                // Stats to be displayed in the UI
                const bandwidths = []; this.stats.set("Bandwidth", bandwidths);
                const bufferAmounts = []; this.stats.set("Buffer", bufferAmounts);
                const latencies = []; this.stats.set("Latency", latencies);
                const e2eLatencies = []; this.stats.set("Latency e2e", e2eLatencies);
                const playbackRates = []; this.stats.set("Playback rate", playbackRates);
                const playbackSpeeds = []; this.stats.set("Playback speed", playbackSpeeds);
                const fps = []; this.stats.set("Video FPS", fps);
                const trackAudio = []; this.stats.set("Track audio", trackAudio);
                const trackVideo = []; this.stats.set("Track video", trackVideo);
                const stalls = []; this.stats.set("Stalls", stalls);

                this.uiStats = new UIMetrics(this.$refs.stats);

                let previousMeasurementTimestamp = null;
                let previousPlaybackPosition = 0;
                let previousFrames = 0;

                let presentedFrames = 0;
                const countFrame = (_, metadata) => {
                    presentedFrames = metadata.presentedFrames;
                    this.$refs.video.requestVideoFrameCallback(countFrame);
                };
                this.$refs.video.requestVideoFrameCallback?.(countFrame);

                this._recvBytes = new ByteRate(2000);

                this._stalling = false;
                this._userSeek = false;
                this.$refs.video.addEventListener('waiting', () => {

                    if (this._stalling || this.$refs.video.seeking || !this.isPlaying()) {
                        return;
                    }
                    this._stalling = true;
                    ++this.stalls;
                });
                this.$refs.video.addEventListener('playing', () => { this._stalling = false; });

                setInterval(() => {
                    if (!this.isPlaying()) {
                        // A stop or a restart breaks the continuity of the deltas below
                        previousMeasurementTimestamp = null;
                        this.latency = 0;
                        this.uiStats.display(this.stats);
                        return;
                    }
                    this.hasMetrics = true;
                    const video = this.$refs.video;
                    const now = performance.now();
                    const elapsedSeconds = previousMeasurementTimestamp === null
                        ? 0
                        : (now - previousMeasurementTimestamp) / 1000;
                    // No delta available on the first poll after a (re)start
                    const perSecond = delta => (elapsedSeconds ? delta / elapsedSeconds : 0);
                    // A seek makes every media-time delta of this poll meaningless
                    const seekOccurred = this._userSeek || video.seeking;
                    this._userSeek = false;

                    bandwidths.push(Math.round(this._recvBytes.value() * 8 / 1000) + "kbps");

                    const buffer = Math.min(
                        this.player.getTracksFor('audio').length ? this.player.getBufferLength('audio') : Infinity,
                        this.player.getTracksFor('video').length ? this.player.getBufferLength('video') : Infinity
                    );

                    bufferAmounts.push((Number.isFinite(buffer) ? Math.round(buffer * 1000) : 0) + "ms");

                    this.latency = Math.round(this.player.getCurrentLiveLatency() * 1000) || 0;
                    latencies.push(this.latency + "ms");

                    const e2eLatency = EpochTime.getLatency(video, this.canvas, drawContext);
                    if (e2eLatencies.length || (e2eLatency > 0 && e2eLatency < 0xFFFF)) {
                        e2eLatencies.push(e2eLatency + "ms");
                    }

                    const playbackRate = this.player.getPlaybackRate() || 0;
                    playbackRates.push(playbackRate.toFixed(2));

       
                    const playbackPositionChange = video.currentTime - previousPlaybackPosition;
                    // No delta on the first poll after a (re)start: the whole position would read as a jump
                    const discontinuity = elapsedSeconds ? playbackPositionChange - elapsedSeconds * playbackRate : 0;
                    const isDiscontinuous = Math.abs(discontinuity) > DISCONTINUITY_THRESHOLD;

                    // A seek or a jump voids this poll's media-time delta: repeat the last value
                    playbackSpeeds.push(seekOccurred || isDiscontinuous
                        ? Math.max((playbackSpeeds.at(-1) ?? "0.00"),0)
                        : perSecond(playbackPositionChange).toFixed(2));

                    // Firefox has no requestVideoFrameCallback: fall back on the decode counter
                    const frames = video.requestVideoFrameCallback
                        ? presentedFrames
                        : video.getVideoPlaybackQuality?.().totalVideoFrames ?? 0;
                    fps.push(Math.max(0, perSecond(frames - previousFrames)).toFixed(2));

                    trackAudio.push((this.player.getCurrentRepresentationForType('audio')?.bitrateInKbit ?? 0).toFixed() + "kbps");
                    trackVideo.push((this.player.getCurrentRepresentationForType('video')?.bitrateInKbit ?? 0).toFixed() + "kbps");

                    stalls.push(this.stalls);
                    this.times.push({ time: new Date().toISOString(), mediaTime: video.currentTime });

                    previousMeasurementTimestamp = now;
                    previousPlaybackPosition = video.currentTime;
                    previousFrames = frames;

                    this.uiStats.display(this.stats);
                }, 700);
            },
            computed: {
                // Only offer the seek when we're further behind than the catch-up rate can absorb
                isBehindLive() {
                    return Boolean(this.player) && this.latency > Number(this.latencyTarget) + LIVE_DRIFT_THRESHOLD;
                }
            },
            methods: {
                manifestTarget() {
                    return this.player?.isReady()
                        ? Math.round(this.player.getTargetLiveDelay() * 1000) || 0
                        : 0;
                },

                // Manifest URL: a full URL typed by the user is used as-is, otherwise build the
                // Ceeblue CMAF/DASH path '/cmaf/<stream>/index.mpd' on the configured host.
                manifestURL() {
                    if (!this.stream) {
                        this.stream = 'out+de1e6f7c-e5db-450b-9603-c3644274779b';
                        log(`Set default Bunny stream ${this.stream}`).warn();
                    }
                    try {
                        return new URL(this.stream).toString();
                    } catch (_) {
                        // StreamName(?id=accessToken)
                        const found = this.stream.indexOf('?');
                        const streamName = found < 0 ? this.stream : this.stream.substring(0, found);
                        const accessToken = (found < 0 ? null : new URLSearchParams(this.stream.substring(found + 1)).get('id'))
                            || options.token || options.id;
                        const url = new URL(NetAddress.fixProtocol('https', this.host.toString()));
                        url.pathname = '/cmaf/' + streamName + '/index.mpd';
                        if (accessToken) {
                            url.searchParams.set('id', accessToken);
                        }
                        return url.toString();
                    }
                },

                openClip() {
                    this._clipMuted = !this.muted;
                    if (this._clipMuted) {
                        this.mute();
                    }
                    // If CLIP_MANIFEST_URL is null, we fallback to the current stream's manifest URL.
                    this.clipSrc = '/examples/clip-editor.html?url='
                        + encodeURIComponent(CLIP_MANIFEST_URL ?? this.manifestURL());
                },

                closeClip() {
                    this.clipSrc = null;
                    // Only undo the mute if we did it ourselves.
                    if (this._clipMuted) {
                        this.mute();
                        this._clipMuted = false;
                    }
                },

                play() {
                    if (this.player) {
                        this.player.destroy();
                        this.player = null;
                        // Clear the last displayed frame (destroy() only detaches the MediaSource)
                        this.$refs.video.removeAttribute('src');
                        this.$refs.video.load();
                        this.playState = PlayState.STOPPED;
                        this.resetTracks();
                        return;
                    }
                    this.streamError = null;
                    this.resetTracks();
                    // reset stats!
                    this.resetMetrics(true);

                    const url = this.manifestURL();
                    log('Play DASH manifest', url).info();
                    this.playState = PlayState.STARTING;

                    const video = this.$refs.video;
                    video.muted = this.muted;

                    this.player = MediaPlayer().create();
                    this.player.on(MediaPlayer.events.PLAYBACK_PLAYING, () => { this.playState = PlayState.PLAYING; });
                    this.player.on(MediaPlayer.events.STREAM_INITIALIZED, () => this.onMetadata());
                    this.player.on(MediaPlayer.events.FRAGMENT_LOADING_COMPLETED, e => {
                        this._recvBytes.addBytes(e.response?.byteLength || e.request?.bytesLoaded || 0);
                    });
                    this.player.on(MediaPlayer.events.QUALITY_CHANGE_RENDERED, e => this.onTrackChange(e.mediaType, e.newRepresentation));
                    this.player.on(MediaPlayer.events.ERROR, e => {
                        const error = e.error || {};
                        this.streamError = {
                            type: 'Dash',
                            name: error.message || 'Playback error',
                            detail: typeof error.data === 'object' ? JSON.stringify(error.data) : error.data || null
                        };
                        log('DASH error', error).error();
                    });
                    this.setLatencyTarget();
                    this.player.initialize(video, url, true);
                },
                // TODO: Stop()

                // dash.js targets a single live delay
                setLatencyTarget(target) {
                    let profile;
                    if(!isNaN(target)) {
                        // manual mode
                        profile = this.netProfiles.entries().next().value;
                        this.netProfile = profile[0];
                        profile = profile[1];

                        // Store it in the profile too: play() and the profile <select> call setLatencyTarget()
                        // with no argument, and that path re-reads the target from the profile entry.
                        profile[1] = this.latencyTarget = Number(target);
                    } else {
                        // Manifest or predefined target
                        profile = this.netProfiles.get(this.netProfile);
                        this.latencyTarget = profile[1] ?? 0;
                    }

                    if (this.player) {
                        // 0 => NaN => no override: dash.js uses the manifest's ServiceDescription/@suggestedPresentationDelay.
                        // Forcing a target below the manifest's advertised minimum pins the catch-up rate at its
                        // maximum forever, which drains the buffer and stalls instead of stabilising it.
                        this.player.updateSettings({ streaming: { delay: { liveDelay: this.latencyTarget / 1000 || NaN } } });
                        if (!this.latencyTarget) {
                            this.latencyTarget = this.manifestTarget();
                        }
                    }

                    // Display user description
                    this.netDescription = profile[0];
                    this.netDescription += this.latencyTarget
                        ? '<br><strong>Target latency ≈ ' + this.latencyTarget + 'ms</strong>'
                        : '<br><strong>Target latency read from the manifest</strong>';
                },

                selectBottomTab(tab) {
                    this.activeBottomTab = tab;
                    if (tab === 'messages') {
                        this.unreadMessages = 0;
                    }
                },

                resetMetrics(all = false) {
                    this.uiStats.reset();
                    // reset incremental metrics counters
                    this.stalls = 0;
                    const displayableCount = all ? 0 : this.uiStats.displayableCount;
                    for (const [_, values] of this.stats) {
                        values.splice(0, Math.max(0, values.length - displayableCount));
                    }
                    this.times.splice(0, Math.max(0, this.times.length - displayableCount));
                    if (all) {
                        this.hasMetrics = false;
                        this._recvBytes.clear();
                    }
                },

                download(name, data, type) {
                    const url = URL.createObjectURL(new Blob([data], { type }));
                    const link = document.createElement("a");
                    link.setAttribute("href", url);
                    link.setAttribute("download", name);
                    document.body.appendChild(link);
                    link.click();
                    document.body.removeChild(link);
                    URL.revokeObjectURL(url);
                },

                downloadStats() {
                    // Write headers and compute max values
                    let max = this.times.length;
                    const headers = ["localTime", "mediaTime"];
                    for (const [header, values] of this.stats) {
                        headers.push(header);
                        max = Math.max(max, values.length);
                    }
                    let csv = headers.join(';');

                    // Write CSV
                    for (let i = 0; i < max; ++i) {
                        csv += '\n';
                        const { time, mediaTime } = this.times[i] ?? {};
                        csv += (time || '') + ';' + (mediaTime || '') + ';';
                        for (const [_, values] of this.stats) {
                            csv += (values[i] == null ? '' : parseFloat(values[i])) + ';';
                        }
                    }

                    // Download the csv !
                    this.download("stats.csv", csv, 'text/csv;charset=utf-8;');
                },

                goLive() {
                    if (this.player) {
                        // Our own seeks are the ones the metrics must ignore, unlike dash.js gap jumps
                        this._userSeek = true;
                        this.player.seekToOriginalLive();
                    }
                },

                resetTracks() {
                    this.audioTracks = new Map();
                    this.audioTrack = 'Audio';
                    this.audioTrackId = undefined;
                    this.videoTracks = new Map();
                    this.videoTrack = 'Video';
                    this.videoTrackId = undefined;
                },

                onMetadata() {
                    if (!this.latencyTarget) {
                        this.latencyTarget = this.manifestTarget();
                    }
                    this.videoTracks = this.buildTracks('video');
                    this.audioTracks = this.buildTracks('audio');
                    for (const type of ['video', 'audio']) {
                        const current = this.player.getCurrentRepresentationForType(type);
                        if (current) {
                            this.onTrackChange(type, current);
                        }
                    }
                    log(`onMetadata ${Util.stringify({ video: [...this.videoTracks.values()], audio: [...this.audioTracks.values()] })}`).info();
                },

                buildTracks(type) {
                    const tracks = new Map();
                    for (const representation of this.player.getRepresentationsByType(type)) {
                        let name = representation.codecs || representation.id;
                        if (type === 'video') {
                            name += ` ${representation.width}x${representation.height} ${representation.frameRate}fps`;
                        }
                        tracks.set(representation.id, `${name} ${representation.bitrateInKbit.toFixed()}kbps`);
                    }
                    return tracks;
                },

                onTrackChange(type, representation) {
                    const tracks = type === 'video' ? this.videoTracks : this.audioTracks;
                    const label = tracks.get(representation.id);
                    if (type === 'video') {
                        if (this.videoTrackId != null) {
                            this.videoTrackId = representation.id;
                        }
                        this.videoTrack = label;
                    } else {
                        if (this.audioTrackId != null) {
                            this.audioTrackId = representation.id;
                        }
                        this.audioTrack = label;
                    }
                    log(`onTrackChange ${type} ${label}`).info();
                },

                onVideoTrackChange() {
                    this.setTrack('video', this.videoTrackId);
                },

                onAudioTrackChange() {
                    this.setTrack('audio', this.audioTrackId);
                },

                setTrack(type, id) {
                    if (!this.player) {
                        return;
                    }
                    // A track change replaces the buffer, same treatment as a seek for the metrics
                    this._userSeek = true;
                    this.player.updateSettings({ streaming: { abr: { autoSwitchBitrate: { [type]: id == null } } } });
                    if (id != null) {
                        this.player.setRepresentationForTypeById(type, id);
                    }
                },

                mute() {
                    this.muted = !this.muted;
                    this.$refs.video.muted = this.muted;
                },

                // ── Theme ──
                cycleTheme() {
                    this.theme = THEME_CYCLE[(THEME_CYCLE.indexOf(this.theme) + 1) % THEME_CYCLE.length];
                    localStorage.setItem('wrts-theme', this.theme);
                    this.applyTheme();
                },
                applyTheme(systemChange = false) {
                    const dark = systemChange ? matchMedia('(prefers-color-scheme: dark)').matches : this.theme === 'dark';
                    document.documentElement.dataset.theme = dark ? 'dark' : 'light';
                },
                themeIcon() {
                    return { light: 'fa-sun', dark: 'fa-moon' }[this.theme];
                },
                themeTooltip() {
                    return `Theme: ${this.theme} (click to cycle)`;
                },

                // ── Player overlay controls (fullscreen / stop on hover or tap) ──
                onPlayerActivity() {
                    if (!this.isPlaying()) { return; }
                    this._scheduleControls();
                },
                onPlayerLeave() {
                    clearTimeout(this._controlsTimer);
                    this.controlsVisible = false;
                },
                onPlayerTouch(event) {
                    if (!this.isPlaying()) { return; }
                    // Treat the touch as button-targeted only when controls are *already* visible —
                    // otherwise the user can't see the button, so any tap there must just mean "reveal".
                    if (this.controlsVisible && event.target.closest('.pc-btn')) {
                        this._scheduleControls();
                        return;
                    }
                    event.preventDefault();
                    if (this.controlsVisible) {
                        clearTimeout(this._controlsTimer);
                        this.controlsVisible = false;
                    } else {
                        this._scheduleControls();
                    }
                },
                _scheduleControls() {
                    this.controlsVisible = true;
                    clearTimeout(this._controlsTimer);
                    this._controlsTimer = setTimeout(() => { this.controlsVisible = false; }, 3000);
                },
                fullscreen() {
                    const video = this.$refs.video;
                    const target = this.$refs.player; // fullscreen the container so our overlay stays reachable

                    if (document.fullscreenElement || document.webkitFullscreenElement) {
                        (document.exitFullscreen || document.webkitExitFullscreen).call(document);
                        return;
                    }
                    if (video && video.webkitDisplayingFullscreen) {
                        video.webkitExitFullscreen && video.webkitExitFullscreen();
                        return;
                    }
                    if (target && target.requestFullscreen) {
                        target.requestFullscreen();
                    } else if (target && target.webkitRequestFullscreen) {
                        target.webkitRequestFullscreen();
                    } else if (video && video.webkitEnterFullscreen) {
                        // iOS Safari fallback: native fullscreen on the video element only.
                        video.webkitEnterFullscreen();
                    }
                },

                isPlaying() {
                    return this.playState === PlayState.PLAYING;
                },
                isStarting() {
                    return this.playState === PlayState.STARTING;
                },
                isStopped() {
                    return this.playState === PlayState.STOPPED;
                }
            }
        }).mount('#main');
    </script>
</html>

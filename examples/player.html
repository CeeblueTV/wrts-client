<html lang="en">
    <head>
        <title>Ceeblue WebRTS Player</title>
        <meta charset="utf-8">
        <meta content="width=device-width, initial-scale=1.0, viewport-fit=cover" name="viewport">
        <meta name="color-scheme" content="light dark">

        <link rel="icon" href="./assets/ceeblue-logo-32x32.png" sizes="32x32">
        <link rel="icon" href="./assets/ceeblue-logo-192x192.png" sizes="192x192">

        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

        <link href="./css/solid.css" rel="stylesheet">
        <link href="./css/fontawesome.css" rel="stylesheet">
        <link href="./css/main.css" rel="stylesheet">

        <script>
            // Apply theme synchronously to avoid FOUC. Stored value is 'light' | 'dark'.
            (function() {
                console.log("localStorage theme:", localStorage.getItem('wrts-theme'));
                console.log("prefers-color-scheme:", matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');

                var stored = localStorage.getItem('wrts-theme') || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
                document.documentElement.dataset.theme = stored === 'dark' ? 'dark' : 'light';
            })();
        </script>
    </head>
    <body>
        <div class="shell" id="main" v-cloak>

            <header class="hdr">
                <img alt="Ceeblue" src="./assets/ceeblue-logo.png">
                <h1>
                    WebRTS <em>Player</em>
                </h1>
                <button class="theme-btn" :title="themeTooltip()" @click="cycleTheme()">
                    <i class="fas" :class="themeIcon()"></i>
                </button>
            </header>

            <div>

                <!-- Video -->
                <div class="player" ref="player"
                    @mouseenter="onPlayerActivity()"
                    @mousemove="onPlayerActivity()"
                    @mouseleave="onPlayerLeave()"
                    @touchstart="onPlayerTouch($event)"
                    @contextmenu="onPlayerContextMenu($event)">

                    <video autoplay id="video" ref="video" playsinline></video>

                    <!-- Hover/touch revealed controls (only while playing) -->
                    <div class="player-ctrls"
                        :class="{ 'is-active': isPlaying(), 'is-visible': controlsVisible }">
                        <button class="pc-btn pc-full"
                            :title="isFullscreen ? 'Exit fullscreen' : 'Fullscreen'"
                            @click="fullscreen()">
                            <i class="fas" :class="isFullscreen ? 'fa-compress' : 'fa-expand'"></i>
                        </button>
                        <button class="pc-btn pc-stop" title="Stop" @click="play()">
                            <i class="fas fa-stop"></i>
                        </button>
                    </div>

                    <!-- Stopped → big Play | Starting → spinner | Mid-stream pause → resume -->
                    <button class="player-action" title="Play" @click="play()" v-if="isStopped()">
                        <i class="fas fa-play"></i>
                    </button>
                    <div class="player-action is-loading" v-else-if="isStarting()">
                        <div class="ring"></div>
                    </div>
                    <button class="player-action is-resume" title="Resume"
                        @click="player.paused = false"
                        v-else-if="player && player.paused">
                        <i class="fas fa-play"></i>
                    </button>

                    <div class="player-alert" v-if="streamError">
                        <i class="fas fa-exclamation-triangle"></i>
                        <div class="player-alert-body">
                            <div class="player-alert-title">
                                <span class="player-alert-type" v-if="streamError.type">{{ streamError.type }}</span>
                                <span class="player-alert-name">{{ streamError.name }}</span>
                            </div>
                            <div class="player-alert-detail" v-if="streamError.detail">{{ streamError.detail }}</div>
                            <div class="player-alert-fields" v-if="streamError.fields.length">
                                <span class="player-alert-field" v-for="f in streamError.fields" :key="f.label">
                                    <strong>{{ f.label }}</strong>{{ f.value }}
                                </span>
                            </div>
                        </div>
                        <button class="player-alert-x" @click="setStreamError(null)"
                            title="Dismiss" aria-label="Dismiss">
                            <i class="fas fa-times"></i>
                        </button>
                    </div>
                </div>

                <!-- Track selects -->
                <div class="row2 gap-panel">
                    <div>
                        <span class="lbl">Video track</span>
                        <select class="sel" id="video-track-selection"
                            :disabled="!player || !player.trackSelectable"
                            v-model="videoTrackId" @change="onVideoTrackChange()">
                            <option :value="undefined" :key="videoTrack">AUTO — {{ videoTrack }}</option>
                            <option v-for="[idx, track] of videoTracks" :value="idx">{{ track }}</option>
                        </select>
                    </div>
                    <div>
                        <span class="lbl">Audio track</span>
                        <select class="sel" id="audio-track-selection"
                            :disabled="!player || !player.trackSelectable"
                            v-model="audioTrackId" @change="onAudioTrackChange()">
                            <option :value="undefined" :key="audioTrack">AUTO — {{ audioTrack }}</option>
                            <option v-for="[idx, track] of audioTracks" :value="idx">{{ track }}</option>
                        </select>
                    </div>
                </div>

                <!-- Stream name (full width) -->
                <div class="stream-row gap-panel">
                    <input class="inp" :disabled="isPlaying()"
                        placeholder="StreamName(?id=accessToken) or URL"
                        type="text" v-model="stream">
                </div>

                <!-- Controls: mute / live / frame-skip / protection -->
                <div class="ctrl-row gap-panel">
                    <button class="btn" title="Mute or unmute audio" v-on:click="mute">
                        <i class="fas" :class="{ 'fa-volume-up': !muted, 'fa-volume-xmark': muted }"></i>
                        {{ muted ? 'Unmute' : 'Mute' }}
                    </button>

                    <button class="btn" title="Jump to live position"
                        :class="{ 'btn-red': player && bufferAmount > player.bufferLimitMiddle }"
                        :disabled="!player || bufferAmount <= player.bufferLimitMiddle"
                        @mouseleave="leaveGoLive" @touchend="leaveGoLive" v-on:click="goLive">
                        <i class="fas fa-rocket"></i>
                        Live
                    </button>

                    <label title="Enable or disable adaptive frame skipping" class="tog" :class="{ on: adaptiveFrameSkipping, off: !mutableReliability() }">
                        <input type="checkbox" :disabled="!mutableReliability()"
                            v-model="adaptiveFrameSkipping" @change="onReliable()">
                        <span class="tog-track"></span>
                        <span>Frame Skip</span>
                    </label>

                    <button class="btn" :class="{ 'btn-cyan': keySystem }"
                        :style="{ display: isPlaying() && !keySystem ? 'none' : '' }"
                        :disabled="isPlaying()"
                        title="Content protection settings" @click="showSettings = true">
                        <i class="fas fa-shield-alt"></i>
                        {{ activeDrmLabel() }}
                    </button>
                </div>

                <!-- Network profile + buffer min/max (single compact row).
                    Description is grid-positioned inside the row so it sits next to the
                    profile select on mobile (instead of floating below the buffer inputs). -->
                <div class="net-row net-buffers gap-panel">
                    <div class="net-prof">
                        <span class="lbl">Network profile</span>
                        <select class="sel" v-model="netProfile" @change="setBuffer()">
                            <option :value="profil" v-for="[profil, _] of netProfiles">{{ profil }}</option>
                        </select>
                    </div>
                    <div class="buf-min">
                        <span class="lbl">Buffer min (ms)</span>
                        <input class="inp" type="number" min="0"
                            required oninput="validity.valid||(value='');"
                            v-model="bufferMin" @change="setBuffer(this.bufferMin, this.bufferMax)">
                    </div>
                    <div class="buf-max">
                        <span class="lbl">Buffer max (ms)</span>
                        <input class="inp" type="number" min="0"
                            required oninput="validity.valid||(value='');"
                            v-model="bufferMax" @change="setBuffer(this.bufferMin, this.bufferMax)">
                    </div>
                    <p class="net-desc" v-html="netDescription"></p>
                </div>

                <!-- Tabs -->
                <div>
                    <div class="tab-bar">
                        <button class="tab-btn" :class="{ on: activeBottomTab === 'graph' }"
                            @click="selectBottomTab('graph')">Graph</button>
                        <button class="tab-btn" :class="{ on: activeBottomTab === 'messages' }"
                            @click="selectBottomTab('messages')">
                            Messages
                            <span class="tab-badge" v-if="unreadMessages > 0">{{ unreadMessages }}</span>
                        </button>
                    </div>

                    <div class="tab-body">
                        <!-- Graph -->
                        <div v-show="activeBottomTab === 'graph'">
                            <ul class="stats-list" ref="stats"></ul>
                            <div class="stats-actions" v-show="hasMetrics">
                                <img alt="Reset" title="Reset incremental metrics and rescale the chart"
                                    @click="resetMetrics()" src="./assets/reload.png">
                                <img alt="Download CSV" title="Download metrics as a CSV file"
                                    @click="downloadStats()" src="./assets/download.png">
                                <img alt="Dump media" title="Dump media as MP4 files"
                                    @click="dump()" src="./assets/dump.png"
                                    v-show="audioDump || videoDump">
                            </div>
                        </div>

                        <!-- Messages -->
                        <div v-show="activeBottomTab === 'messages'">
                            <div class="msg-box" ref="messagesPanel">
                                <div class="msg-empty" v-if="messages.length === 0">No data messages received yet.</div>
                                <div v-for="(message, idx) in messages" :key="idx" class="msg-row">
                                    <span class="msg-track">[{{ message.track }}]</span>
                                    <span class="msg-time"> {{ message.receivedAt }} </span>{{ message.text }}
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- DRM Modal -->
                <template v-if="showSettings">
                    <div class="modal-back" @click="closeSettings()"></div>
                    <div class="modal-wrap">
                        <div class="modal-box" @click.stop>
                            <div class="modal-hd">
                                <i class="fas fa-shield-alt"></i>
                                <h5>Content Protection</h5>
                                <button class="modal-x" @click="closeSettings()" aria-label="Close">
                                    <i class="fas fa-times"></i>
                                </button>
                            </div>

                            <div class="modal-bd">
                                <p class="modal-hint">
                                    License URLs are not pre-filled. A DRM is included only when enabled
                                    <em>and</em> its license URL is set.
                                </p>

                                <div v-for="drm in contentProtection" :key="drm.id"
                                    class="drm-card"
                                    :class="{ enabled: drm.enabled, active: isDrmActive(drm) }">

                                    <div class="drm-hd">
                                        <label class="tog" :class="{ on: drm.enabled }"
                                            style="border:none; background:none; padding:0;"
                                            @click.stop>
                                            <input :id="'drm-' + drm.id + '-enabled'" type="checkbox"
                                                :disabled="isPlaying()" v-model="drm.enabled">
                                            <span class="tog-track"></span>
                                        </label>
                                        <span class="drm-name">{{ drm.label }}</span>
                                        <span class="badge-active" v-if="isDrmActive(drm)">Active</span>
                                    </div>

                                    <div class="drm-bd" v-if="drm.enabled">
                                        <div class="drm-field">
                                            <span class="lbl">License URL</span>
                                            <input class="inp" type="text"
                                                :disabled="!drm.enabled || isPlaying()"
                                                v-model="drm.license" placeholder="https://...">
                                        </div>

                                        <div class="drm-field" v-if="drm.id === 'fairplay'">
                                            <span class="lbl">Certificate URL</span>
                                            <input class="inp" type="text"
                                                :disabled="!drm.enabled || isPlaying()"
                                                v-model="drm.certificate" placeholder="https://...">
                                        </div>

                                        <div class="drm-field">
                                            <span class="lbl">
                                                HTTP headers
                                                <button class="btn-link"
                                                    :disabled="!drm.enabled || isPlaying()"
                                                    @click="addHeader(drm)">
                                                    <i class="fas fa-plus"></i> Add header
                                                </button>
                                            </span>
                                            <div class="hdr-list">
                                                <div v-if="drm.headers.length === 0"
                                                    style="font-size:11.5px; color:var(--txt-m); font-style:italic;">
                                                    No headers
                                                </div>
                                                <div v-for="(header, idx) in drm.headers" :key="idx" class="hdr-row">
                                                    <input class="inp" type="text"
                                                        :disabled="!drm.enabled || isPlaying()"
                                                        v-model="header.name" placeholder="Header name">
                                                    <input class="inp" type="text"
                                                        :disabled="!drm.enabled || isPlaying()"
                                                        v-model="header.value" placeholder="Value">
                                                    <button class="btn-rm"
                                                        :disabled="!drm.enabled || isPlaying()"
                                                        @click="removeHeader(drm, idx)"
                                                        title="Remove header">
                                                        <i class="fas fa-times"></i>
                                                    </button>
                                                </div>
                                            </div>
                                        </div>

                                        <div class="rob-row">
                                            <div class="drm-field">
                                                <span class="lbl">Audio robustness</span>
                                                <select v-if="drm.id === 'widevine'" class="sel"
                                                    :disabled="!drm.enabled || isPlaying()"
                                                    v-model="drm.audioRobustness">
                                                    <option v-for="[label, value] in audioRobustnesses" :value="value">{{ label }}</option>
                                                </select>
                                                <input v-else class="inp" type="text"
                                                    :disabled="!drm.enabled || isPlaying()"
                                                    v-model="drm.audioRobustness" placeholder="comma-separated">
                                            </div>
                                            <div class="drm-field">
                                                <span class="lbl">Video robustness</span>
                                                <select v-if="drm.id === 'widevine'" class="sel"
                                                    :disabled="!drm.enabled || isPlaying()"
                                                    v-model="drm.videoRobustness">
                                                    <option v-for="[label, value] in videoRobustnesses" :value="value">{{ label }}</option>
                                                </select>
                                                <input v-else class="inp" type="text"
                                                    :disabled="!drm.enabled || isPlaying()"
                                                    v-model="drm.videoRobustness" placeholder="comma-separated">
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>

                            <div class="modal-ft">
                                <button class="btn btn-primary" @click="closeSettings()">Done</button>
                            </div>
                        </div>
                    </div>
                </template>

            </div>
            <!-- #main -->
        </div>
        <!-- .shell -->
    </body>
    <script type="module">
        import { Player, HTTPAdaptiveSource, WSSource, HTTPSource, Media, VERSION, utils } from "../dist/wrts-client.bundle.js";
        // development version, includes helpful console warnings
        // import { createApp } from 'https://cdn.jsdelivr.net/npm/vue@3/dist/vue.esm-browser.js';
        // production version, optimized for size and speed
        import { createApp, nextTick } from 'https://cdn.jsdelivr.net/npm/vue@3/dist/vue.esm-browser.prod.js';
        const { EpochTime, Util, NetAddress, Connect, LogLevel, log, UIMetrics, BinaryWriter } = utils;

        // displays logs ERROR, WARN & INFO logs,
        // can be even more detailed with LogLevel.DEBUG
        log.level = LogLevel.INFO;

        const options = Util.options();

        // On-screen log overlay for on-device debugging (e.g. Android with no working
        // chrome://inspect). Append `?debugoverlay` to the URL to enable.
        if (options.debugoverlay) {
            setupDebugOverlay();
        }

        log('wrts-client version:', VERSION).info();
        log('web-utils version:', utils.VERSION).info();

        const PlayState = {
            PLAYING: 'PLAYING',
            STARTING: 'STARTING',
            STOPPED: 'STOPPED'
        };

        const THEME_CYCLE = ['light', 'dark'];

        // HTMLMediaElement.error.code → MediaError constant name. Surfaced in the alert when the
        // native video element fires `onerror` (the Player usually wraps this in a richer
        // 'Playback error' via onStop, but we render the raw code in case it doesn't).
        const MEDIA_ERROR_NAMES = {
            1: 'MEDIA_ERR_ABORTED',
            2: 'MEDIA_ERR_NETWORK',
            3: 'MEDIA_ERR_DECODE',
            4: 'MEDIA_ERR_SRC_NOT_SUPPORTED'
        };

        // Keys handled explicitly by the alert UI (rendered as title/badge/detail). Any other
        // own-property on the error object is shown as a key/value chip so subsystem-specific
        // context (mimeType, track, url, reason, code, …) stays visible without per-variant code.
        const ALERT_RESERVED_KEYS = new Set(['type', 'name', 'detail']);

        // URL-safe base64 round-trip for UTF-8 strings: `+` and `/` are remapped to `-` and `_`
        // and padding is stripped, so the encoded value can sit directly in a query parameter
        // without further percent-encoding.
        function utf8ToBase64Url(str) {
            const bytes = new TextEncoder().encode(str);
            let binary = '';
            for (const byte of bytes) {
                binary += String.fromCharCode(byte);
            }
            return btoa(binary).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
        }
        function base64UrlToUtf8(str) {
            const padded = str.replace(/-/g, '+').replace(/_/g, '/') + '==='.slice(0, (4 - str.length % 4) % 4);
            const binary = atob(padded);
            const bytes = new Uint8Array(binary.length);
            for (let i = 0; i < binary.length; i++) {
                bytes[i] = binary.charCodeAt(i);
            }
            return new TextDecoder().decode(bytes);
        }

        // Builds a fixed, collapsible on-screen panel that mirrors every `log()` line (newest at the end,
        // so logs can be read and copied directly on a device. Hooks the global `log.on` non-destructively
        // (default console output still runs). Enabled via the `?debugoverlay` query parameter.
        function setupDebugOverlay() {
            const PANEL_VH = 40; // expanded height
            const MAX_ROWS = 500; // cap retained log rows to avoid unbounded DOM/memory growth
            // Container: header bar (always visible) + scrollable log box.
            const panel = document.createElement('div');
            panel.style.cssText =
                'position:fixed;bottom:0;left:0;right:0;z-index:99999;' +
                'background:rgba(0,0,0,.85);font:11px/1.35 monospace;';
            const header = document.createElement('div');
            header.style.cssText =
                'display:flex;gap:8px;align-items:center;padding:3px 6px;' +
                'background:#111;color:#ccc;border-top:1px solid #333;cursor:pointer;user-select:none';
            const title = document.createElement('span');
            title.textContent = '▾ debug logs';
            title.style.flex = '1';
            const copyBtn = document.createElement('button');
            copyBtn.textContent = 'copy';
            copyBtn.style.cssText = 'font:11px monospace';
            const clearBtn = document.createElement('button');
            clearBtn.textContent = 'clear';
            clearBtn.style.cssText = 'font:11px monospace';
            const box = document.createElement('div');
            box.style.cssText =
                'overflow:auto;color:#9f9;padding:4px 6px;white-space:pre-wrap;word-break:break-word;' +
                'height:' + PANEL_VH + 'vh';
            header.append(title, copyBtn, clearBtn);
            panel.append(header, box);

            let collapsed = false;
            const apply = () => {
                box.style.display = collapsed ? 'none' : 'block';
                title.textContent = (collapsed ? '▸' : '▾') + ' debug logs';
                // Reserve page space so the panel never permanently hides page content
                // (e.g. the bottom of the metrics graph). Collapsed → just the header bar.
                document.body.style.paddingBottom = collapsed ? '26px' : 'calc(' + PANEL_VH + 'vh + 26px)';
            };
            header.onclick = e => {
                if (e.target === clearBtn || e.target === copyBtn) { return; }
                collapsed = !collapsed;
                apply();
            };
            clearBtn.onclick = () => { box.textContent = ''; };
            copyBtn.onclick = () => {
                // Rows are oldest-on-top (chronological), copy as-is.
                const text = Array.from(box.children).map(r => r.textContent).join('\n');
                const done = ok => {
                    copyBtn.textContent = ok ? 'copied!' : 'copy failed';
                    setTimeout(() => { copyBtn.textContent = 'copy'; }, 1500);
                };
                // navigator.clipboard needs a secure context (https/localhost); fall back to
                // a temporary textarea + execCommand for plain-http LAN access from the phone.
                if (navigator.clipboard && window.isSecureContext) {
                    navigator.clipboard.writeText(text).then(() => done(true), () => done(false));
                } else {
                    const ta = document.createElement('textarea');
                    ta.value = text;
                    ta.style.cssText = 'position:fixed;top:0;left:0;opacity:0';
                    document.body.appendChild(ta);
                    ta.focus();
                    ta.select();
                    let ok = false;
                    try { ok = document.execCommand('copy'); } catch (_) {}
                    document.body.removeChild(ta);
                    done(ok);
                }
            };

            const ready = () => { document.body.appendChild(panel); apply(); };
            document.readyState === 'loading' ? addEventListener('DOMContentLoaded', ready) : ready();
            log.on = (level, args) => {
                const line = args
                    .map(a => (typeof a === 'object' && a !== null ? Util.stringify(a) : String(a)))
                    .join(' ');
                const row = document.createElement('div');
                row.style.color = level === 'error' ? '#f55' : level === 'warn' ? '#fd5' : '#9f9';
                const d = new Date();
                const ts =
                    String(d.getHours()).padStart(2, '0') + ':' +
                    String(d.getMinutes()).padStart(2, '0') + ':' +
                    String(d.getSeconds()).padStart(2, '0') + '.' +
                    String(d.getMilliseconds()).padStart(3, '0');
                row.textContent = `${ts} [${level}] ${line}`;
                // Stick to the end only when the user is already at the bottom and isn't
                // selecting text inside the box (so manual scroll-up / text selection is preserved).
                const slack = 4; // px tolerance for "at bottom"
                const wasAtBottom = box.scrollTop + box.clientHeight >= box.scrollHeight - slack;
                const sel = window.getSelection();
                const selecting = sel && !sel.isCollapsed && box.contains(sel.anchorNode);
                box.appendChild(row); // newest at the end
                // Trim oldest rows (top) to keep DOM/memory bounded on long sessions
                while (box.childElementCount > MAX_ROWS) {
                    box.removeChild(box.firstChild);
                }
                if (wasAtBottom && !selecting) {
                    box.scrollTop = box.scrollHeight;
                }
            };
        }

        createApp({
            data() {
                return {
                    PlayState: PlayState,
                    playState: PlayState.STOPPED,

                    stream: '',
                    muted: false,
                    host: null,
                    bufferMin: 0,
                    bufferMax: 0,
                    bufferAmount: 0,

                    audioDump: options.dump ? new BinaryWriter() : undefined,
                    videoDump: options.dump ? new BinaryWriter() : undefined,

                    keySystem: null,
                    showSettings: false,

                    theme: localStorage.getItem('wrts-theme') || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'),
                    controlsVisible: false,
                    _controlsTimer: null,
                    isFullscreen: false,

                    // Widevine-only robustness presets. Keyed by display label, the value is the
                    // comma-joined robustness string stored on `contentProtection[*].*Robustness`.
                    videoRobustnesses: new Map([
                        ['HW & SW', 'HW_SECURE_DECODE,SW_SECURE_DECODE'],
                        ['SW', 'SW_SECURE_DECODE'],
                        ['HW', 'HW_SECURE_DECODE'],
                        ['All', 'HW_SECURE_ALL,HW_SECURE_DECODE,SW_SECURE_DECODE'],
                        ['(empty)', '']
                    ]),
                    audioRobustnesses: new Map([
                        ['HW & SW', 'HW_SECURE_CRYPTO,SW_SECURE_CRYPTO'],
                        ['SW', 'SW_SECURE_CRYPTO'],
                        ['HW', 'HW_SECURE_CRYPTO'],
                        ['All', 'HW_SECURE_ALL,HW_SECURE_CRYPTO,SW_SECURE_CRYPTO'],
                        ['(empty)', '']
                    ]),
                    contentProtection: [
                        { id: 'widevine', label: 'Widevine', keySystem: 'com.widevine.alpha',
                            enabled: true, license: '', headers: [],
                            audioRobustness: 'HW_SECURE_CRYPTO,SW_SECURE_CRYPTO',
                            videoRobustness: 'HW_SECURE_DECODE,SW_SECURE_DECODE' },
                        { id: 'playready', label: 'PlayReady', keySystem: 'com.microsoft.playready',
                            enabled: true, license: '', headers: [], audioRobustness: '', videoRobustness: '' },
                        { id: 'fairplay', label: 'FairPlay', keySystem: 'com.apple.fps.1_0',
                            enabled: true, license: '', certificate: '', headers: [], audioRobustness: '', videoRobustness: '' }
                    ],

                    canvas: document.createElement('canvas'),

                    startTime: 0,
                    adaptiveFrameSkipping: true,
                    fixedPlaybackRate: options.fixedRate ? true : false,
                    streamMetadata: null,
                    netDescription: "",
                    videoTracks: new Map(),
                    videoTrack: 'Video',
                    videoTrackId: undefined,
                    activeBottomTab: 'graph',
                    messages: [],
                    unreadMessages: 0,
                    sourceType: undefined,
                    audioTracks: new Map(),
                    audioTrack: 'Audio',
                    audioTrackId: undefined,
                    streamError: null,
                    stats: new Map(),
                    times: new Array(),
                    hasMetrics:false,
                    deltaStats: {},
                    uiStats: null,
                    player: null,
                    latencies: [],
                    netProfiles: new Map([
                        ['-manual-', [
                            "Manually configure a buffer window large enough to compensate for variations caused by network fluctuations.",
                        ]],
                        ['ideal', [
                            "Ideal network conditions for low latency: streamer and player are geographically close with minimal intermediary hops.",
                            200, 500 // 350 ms
                        ]],
                        ['normal', [
                            "A stable and reliable network between streamer and player, making their geographical distance negligible.",
                            400, 800 // 600ms
                        ]],
                        ['distant', [
                            "Streamer and player are significantly distant and/or the connection involves multiple intermediaries (e.g., VPNs, CDN providers).",
                            1000, 2000 // 1.5 seconds
                        ]],
                        ['unstable', [
                            "A resilient configuration designed for maximum stability even on challenging networks, prioritizing robustness over low latency.",
                            2000, 4000 // 3 seconds
                        ]],
                    ]),
                    netProfile: 'normal'
                }
            },
            mounted() {
                this.controls = false;

                // init values
                this.loadContentProtectionFromOptions();
                this.adaptiveFrameSkipping = options.reliable ? false : true;
                const host = options.host;
                this.host = new NetAddress(host || location.host, 443);
                this.stream = options.stream || '';
                this.sourceType = (host && host.toLowerCase().startsWith('ws')) ? WSSource : HTTPAdaptiveSource;
                this.setBuffer(Number(options.bufferMin), Number(options.bufferMax))

                // React to system theme changes
                this._mql = matchMedia('(prefers-color-scheme: dark)');
                this._mqlListener = () => { this.applyTheme(true); };
                this._mql.addEventListener('change', this._mqlListener);

                // Track fullscreen state so the overlay button can flip between expand/compress icons.
                // iOS Safari uses native video fullscreen (webkit*fullscreen events on the video).
                this._fsListener = () => {
                    this.isFullscreen = !!(document.fullscreenElement || document.webkitFullscreenElement);
                };
                document.addEventListener('fullscreenchange', this._fsListener);
                document.addEventListener('webkitfullscreenchange', this._fsListener);
                this.$refs.video.addEventListener('webkitbeginfullscreen', () => { this.isFullscreen = true; });
                this.$refs.video.addEventListener('webkitendfullscreen', () => { this.isFullscreen = false; });

                const drawContext = this.canvas.getContext('2d');

                // Stats to be displayed in the UI
                const bandwidths = []; this.stats.set("Bandwidth", bandwidths);
                const bufferAmounts = []; this.stats.set("Buffer", bufferAmounts);
                const latencies = this.latencies; this.stats.set("Latency", latencies);
                const e2eLatencies = []; this.stats.set("Latency e2e", e2eLatencies);
                const playbackRates = []; this.stats.set("Playback rate", playbackRates);
                const playbackSpeeds = []; this.stats.set("Playback speed", playbackSpeeds);
                const fps = []; this.stats.set("Video FPS", fps);
                const trackAudio = []; this.stats.set("Track audio", trackAudio);
                const trackVideo = []; this.stats.set("Track video", trackVideo);
                const skippedAudio = []; this.stats.set("Skipped audio", skippedAudio);
                const skippedVideo = []; this.stats.set("Skipped video", skippedVideo);
                const stalls = []; this.stats.set("Stalls", stalls);

                this.uiStats = new UIMetrics(this.$refs.stats);

                setInterval(() => {
                    const player = this.player;
                    if(player) {
                        this.hasMetrics = true;
                        const stats = player.computeStats();
                       // For bandwidth calculation, using player.recvByteRate is faster than
                       // summing stats.audioByteRate + stats.videoByteRate + stats.dataByteRate.
                        if(bandwidths.length || player.recvByteRate) {
                            bandwidths.push(Math.round(player.recvByteRate *8/1000)+"kbps");
                        }
                        if(bufferAmounts.length || stats.bufferAmount) {
                            bufferAmounts.push((stats.bufferAmount || 0)+"ms");
                        }
                        this.bufferAmount = stats.bufferAmount || 0;
                        if(latencies.length || (options.latency && stats.latency)) {
                            latencies.push((stats.latency || 0) +"ms");
                        }

                        playbackRates.push((stats.playbackRate || 0).toFixed(2));
                        playbackSpeeds.push((stats.playbackSpeed || 0).toFixed(2));
                        fps.push((stats.videoPerSecond || 0).toFixed(2));
                        trackAudio.push(((stats.audioTrackBandwidth || 0)*8/1000).toFixed() + 'kbps');
                        trackVideo.push(((stats.videoTrackBandwidth || 0)*8/1000).toFixed() + 'kbps');

                        skippedAudio.push((((stats.skippedAudio || 0) - (this.deltaStats.skippedAudio || 0)) /1000).toFixed(1)+"s");
                        skippedVideo.push((((stats.skippedVideo || 0) - (this.deltaStats.skippedVideo || 0)) /1000).toFixed(1)+"s");

                        stalls.push((stats.stallCount || 0) - (this.deltaStats.stallCount || 0));

                        const e2eLatency = EpochTime.getLatency(this.$refs.video, this.canvas, drawContext);
                        if(e2eLatencies.length || (e2eLatency>0 && e2eLatency<0xFFFF)) {
                            // displaid only if activated!
                            e2eLatencies.push(e2eLatency+"ms");
                        }
                        this.times.push({
                            time: new Date().toISOString(),
                            mediaTime: player.currentTime
                        });
                    }
                    this.uiStats.display(this.stats);
                }, 700);
            },
            beforeUnmount() {
                if (this._mql && this._mqlListener) this._mql.removeEventListener('change', this._mqlListener);
                if (this._fsListener) {
                    document.removeEventListener('fullscreenchange', this._fsListener);
                    document.removeEventListener('webkitfullscreenchange', this._fsListener);
                }
                if (this._controlsTimer) clearTimeout(this._controlsTimer);
            },
            watch: {
                // Bootstrap JS is not loaded here, so toggle `modal-open` on <body> manually so the
                // page behind the dialog stops scrolling while the settings modal is visible.
                showSettings(value) {
                    document.body.classList.toggle('modal-open', value);
                }
            },
            methods: {
                // ── Error display ──
                // Normalizes any error shape (Player onStop union, synthesized video onerror,
                // synthesized input-validation error) into the structure the .player-alert renders:
                //   { type, name, detail, fields: [{label, value}] }
                // Anything not in ALERT_RESERVED_KEYS becomes a key/value chip so subsystem-specific
                // context (mimeType, track, url, reason, code, …) is shown without per-variant UI.
                setStreamError(error) {
                    if (!error) { this.streamError = null; return; }
                    const fields = [];
                    for (const key of Object.keys(error)) {
                        if (ALERT_RESERVED_KEYS.has(key)) { continue; }
                        const value = error[key];
                        if (value == null || value === '') { continue; }
                        // Stringify primitives directly; for objects, fall back to JSON so they
                        // don't render as "[object Object]".
                        let display;
                        if (typeof value === 'object') {
                            try { display = JSON.stringify(value); } catch (_) { display = String(value); }
                        } else {
                            display = String(value);
                        }
                        fields.push({ label: key, value: display });
                    }
                    // Strip the redundant 'Error' suffix from union discriminants so the badge
                    // reads 'SOURCE' rather than 'SOURCEERROR'.
                    const type = (error.type || '').replace(/Error$/, '') || null;
                    this.streamError = {
                        type,
                        name: error.name || 'Unknown error',
                        detail: error.detail || null,
                        fields
                    };
                },

                // ── Theme ──
                cycleTheme() {
                    this.theme = THEME_CYCLE[(THEME_CYCLE.indexOf(this.theme) + 1) % THEME_CYCLE.length];
                    localStorage.setItem('wrts-theme', this.theme);
                    this.applyTheme();
                },
                applyTheme(systemChange = false) {
                    const dark = systemChange? matchMedia('(prefers-color-scheme: dark)').matches : this.theme === 'dark';
                    document.documentElement.dataset.theme = dark ? 'dark' : 'light';
                },
                themeIcon() {
                    return { light: 'fa-sun', dark: 'fa-moon' }[this.theme];
                },
                themeTooltip() {
                    return `Theme: ${this.theme} (click to cycle)`;
                },

                // ── Player overlay controls (fullscreen / stop on hover or tap) ──
                onPlayerActivity(isTouch = false) {
                    if (!this.isPlaying()) return;
                    this._scheduleControls(isTouch);
                },
                onPlayerLeave() {
                    if (this._controlsTimer) clearTimeout(this._controlsTimer);
                    this.controlsVisible = false;
                },
                onPlayerTouch(event) {
                    if (!this.isPlaying()) return;
                    // Treat the touch as button-targeted only when controls are *already* visible —
                    // otherwise the user can't see the button, so any tap there must just mean "reveal".
                    const onButton = this.controlsVisible && event.target.closest('.pc-btn');
                    if (onButton) {
                        // Let the synthetic click reach the button; just refresh the auto-hide timer.
                        this._scheduleControls(true);
                        return;
                    }
                    // Suppress the synthetic click on the player surface so a single tap can't
                    // accidentally hit a button that wasn't visible yet (first-tap-reveals).
                    event.preventDefault();
                    if (this.controlsVisible) {
                        // Tap on the video while controls are visible → dismiss immediately.
                        if (this._controlsTimer) clearTimeout(this._controlsTimer);
                        this.controlsVisible = false;
                    } else {
                        this._scheduleControls(true);
                    }
                },
                _scheduleControls(/* isTouch */) {
                    this.controlsVisible = true;
                    if (this._controlsTimer) clearTimeout(this._controlsTimer);
                    // 3s for both touch and desktop. Tap outside / mouseleave hides immediately.
                    this._controlsTimer = setTimeout(() => {
                        this.controlsVisible = false;
                    }, 3000);
                },
                onPlayerContextMenu(event) {
                    // Hidden debug shortcut: right-click on the player → dump current buffers and pause.
                    // (Listener lives on the .player container so the overlay can't swallow it.)
                    event.preventDefault();
                    this.dump();
                    if (this.player) {
                        this.player.paused = true;
                    }
                },

                buildStream() {
                    if(!this.stream) {
                        this.stream  = 'out+de1e6f7c-e5db-450b-9603-c3644274779b';
                        log(`Set default Bunny stream ${this.stream}`).warn();
                    }
                    return this.stream;
                },

                buildConnectParams() {
                    let streamName = this.buildStream();
                    let accessToken = options.token || options.id;
                    let endPoint = this.host;
                    let mediaExt;
                    if(this.sourceType === HTTPSource) {
                        mediaExt = '.mp4'; // force CMAF for HTTP Streaming
                    }
                    try {
                        endPoint = new URL(streamName);
                        streamName = endPoint.pathname;
                    } catch(_) {
                        // StreamName(?id=accessTolen)
                        const found = streamName.indexOf("?");
                        if(found>=0) {
                            accessToken = new URLSearchParams(streamName.substring(found+1)).get("id") || accessToken;
                            streamName = streamName.substring(0, found); // remove params
                        }
                        /// remove possible extension in stream name
                        mediaExt = Util.getExtension(streamName);
                        streamName = streamName.substring(0, streamName.length - mediaExt.length);
                    }

                    const contentProtection = this.buildContentProtection();

                    return {
                        endPoint:endPoint.toString(),
                        streamName,
                        accessToken,
                        mediaExt,
                        contentProtection
                    };
                },

                buildContentProtection() {
                    const contentProtection = {};
                    for (const drm of this.contentProtection) {
                        const license = drm.license.trim();
                        if (!drm.enabled || !license) {
                            continue;
                        }

                        // Collapse the row pairs into a {name: value} headers object, dropping empty names.
                        const headers = {};
                        for (const header of drm.headers) {
                            const name = header.name.trim();
                            if (name) {
                                headers[name] = header.value;
                            }
                        }
                        const hasHeaders = Object.keys(headers).length > 0;

                        const audioRobustness = this.parseRobustness(drm.audioRobustness);
                        const videoRobustness = this.parseRobustness(drm.videoRobustness);
                        const hasRobustness = audioRobustness.length || videoRobustness.length;

                        const config = {
                            license: hasHeaders ? { url: license, headers } : license
                        };
                        if (drm.id === 'fairplay') {
                            const cert = drm.certificate.trim();
                            if (cert) {
                                config.certificate = cert;
                            }
                        }
                        if (hasRobustness) {
                            config.configurations = Connect.createMediaKeySystemConfigurations({
                                audioRobustness: audioRobustness.length ? audioRobustness : undefined,
                                videoRobustness: videoRobustness.length ? videoRobustness : undefined
                            });
                            log(`Generated MediaKeySystemConfiguration for ${drm.label}`, config.configurations).info();
                        }
                        contentProtection[drm.keySystem] = config;
                    }
                    return Object.keys(contentProtection).length ? contentProtection : undefined;
                },

                parseRobustness(value) {
                    return value.split(',').map(s => s.trim()).filter(Boolean);
                },

                addHeader(drm) {
                    drm.headers.push({ name: '', value: '' });
                },

                removeHeader(drm, idx) {
                    drm.headers.splice(idx, 1);
                },

                isDrmActive(drm) {
                    if (!this.keySystem) {
                        return false;
                    }
                    if (drm.id === 'fairplay') {
                        return this.keySystem.startsWith('com.apple.fps');
                    }
                    return this.keySystem === drm.keySystem;
                },

                closeSettings() {
                    this.showSettings = false;
                    this.updateURL();
                },

                serializeContentProtection() {
                    // A DRM with no license can't be exercised at playback time, so its other
                    // settings (enabled flag, headers, robustness) are dead weight in the URL.
                    const compact = [];
                    for (const drm of this.contentProtection) {
                        if (!drm.license) { continue; }
                        const entry = { id: drm.id, license: drm.license };
                        if (!drm.enabled) { entry.enabled = false; }
                        if (drm.id === 'fairplay' && drm.certificate) { entry.certificate = drm.certificate; }
                        const headers = drm.headers.filter(h => h.name);
                        if (headers.length) { entry.headers = headers; }
                        if (drm.audioRobustness) { entry.audioRobustness = drm.audioRobustness; }
                        if (drm.videoRobustness) { entry.videoRobustness = drm.videoRobustness; }
                        compact.push(entry);
                    }
                    return compact.length ? JSON.stringify(compact) : null;
                },

                loadContentProtectionFromOptions() {
                    if (!options.contentProtection) {
                        return;
                    }
                    let parsed;
                    try {
                        parsed = JSON.parse(base64UrlToUtf8(options.contentProtection));
                    } catch (err) {
                        log('Failed to parse contentProtection query parameter', err).warn();
                        return;
                    }
                    if (!Array.isArray(parsed)) {
                        return;
                    }
                    for (const entry of parsed) {
                        const drm = this.contentProtection.find(d => d.id === entry.id);
                        if (!drm) { continue; }
                        if (entry.enabled === false) { drm.enabled = false; }
                        if (typeof entry.license === 'string') { drm.license = entry.license; }
                        if (drm.id === 'fairplay' && typeof entry.certificate === 'string') { drm.certificate = entry.certificate; }
                        if (Array.isArray(entry.headers)) {
                            drm.headers = entry.headers
                                .filter(h => h && typeof h.name === 'string')
                                .map(h => ({ name: h.name, value: typeof h.value === 'string' ? h.value : '' }));
                        }
                        if (typeof entry.audioRobustness === 'string') { drm.audioRobustness = entry.audioRobustness; }
                        if (typeof entry.videoRobustness === 'string') { drm.videoRobustness = entry.videoRobustness; }
                    }
                },


                play() {
                    this.startTime = Util.time();
                    log('Play stream', this.stream, 'with options', options).info();
                    if (this.player) {
                        this.player.stop();
                        return;
                    }
                    // reset error
                    this._lastMediaError = null;
                    this.setStreamError(null);
                    // reset stats!
                    this.resetMetrics(true);
                    this.resetMessages();
                    // reset dump if activated
                    if(this.audioDump) {
                        this.audioDump.clear();
                    }
                    if(this.videoDump) {
                        this.videoDump.clear();
                    }

                    // build params
                    const params = this.buildConnectParams();
                    if(!params.streamName) {
                        this.setStreamError({
                            type: 'Input',
                            name: 'Missing stream',
                            detail: 'Enter a non-empty stream name or URL to play.'
                        });
                        return;
                    }

                    this.playState = PlayState.STARTING;

                    const videoElement = this.$refs.video;
                    videoElement.muted = this.muted;
                    videoElement.autoplay = true;
                    videoElement.onloadeddata = () => {
                        log('TTFF :', Util.time()-this.startTime).info();
                        this.playState = PlayState.PLAYING;
                    };
                    videoElement.onerror = () => {
                        const mediaError = videoElement.error;
                        if (mediaError) {
                            // Capture it: the Player resets the video element before calling onStop,
                            // which clears videoElement.error. We read this snapshot in onStop so the
                            // real root cause survives instead of being overwritten by the symptom.
                            this._lastMediaError = { code: mediaError.code, message: mediaError.message };
                            log(
                                '>>> VIDEO MediaError:',
                                MEDIA_ERROR_NAMES[mediaError.code] || mediaError.code,
                                '(code ' + mediaError.code + ')',
                                'message:',
                                mediaError.message || '(empty)'
                            ).error();
                            // The Player will usually emit a richer 'Playback error' via onStop right after,
                            // which will overwrite this. But surface the native MediaError immediately in
                            // case onStop doesn't fire (e.g. error happens before the player is wired up).
                            this.setStreamError({
                                type: 'Video',
                                name: MEDIA_ERROR_NAMES[mediaError.code] || 'Media playback error',
                                detail: mediaError.message || undefined,
                                code: mediaError.code
                            });
                        }
                    };

                    // Now we can start the player
                    this.player = new Player(videoElement, this.sourceType);
                    this.player.onStart = this.onStart.bind(this);
                    this.player.onStop = this.onStop.bind(this);
                    this.player.onTrackChange = this.onTrackChange.bind(this);
                    this.player.onMetadata = this.onMetadata.bind(this);

                    this.player.onAudioAppended = data => this.audioDump && this.audioDump.write(data);
                    this.player.onVideoAppended = data => this.videoDump && this.videoDump.write(data);
                    this.player.onData = (track, time, duration, data) => {
                        this.pushMessage(track, time, data);
                        const codec = this.player.metadata.tracks.get(track)?.codecString;
                        log(
                            `Data reception ${Util.stringify({track,  ...(codec && {codec}), time, duration, data })}`
                        ).info();
                    };
                    this.player.onMediaKeys = (mediaKeysEngine) => {
                        log('MediaKeysEngine', mediaKeysEngine? 'started' : 'stopped').info();
                        // Update enabled DRM based on the active key system
                        this.keySystem = mediaKeysEngine? mediaKeysEngine.keySystem : null;
                    }
                    this.player.onBufferChange = () => {
                        if (this.fixedPlaybackRate) {
                            if (videoElement.playbackRate !== 1) {
                                videoElement.playbackRate = 1;
                            }
                        } else {
                            this.player.adjustPlaybackRate();
                        }
                    };

                    this.setBuffer(); // to set buffer size!
                    this.player.start(params, options.timeout);
                },
                onStart() {
                    log('onStart').info();
                    this.player.reliable = !this.adaptiveFrameSkipping;
                    if(options.combinable != null) {
                        this.player.tracksCombinable = options.combinable ? true : false;
                    }
                    this.player.cmcd = options.cmcd;
                    this.player.cmcdMode = options.cmcdMode;
                    this.player.cmcdSid = options.cmcdSid;
                },
                onStop(error) {
                    const videoElement = this.$refs.video;
                    if(error) {
                        log('onStop', error).error();
                        // Surface the native MediaError: an "Append buffer issue" with
                        // "HTMLMediaElement.error attribute is not null" is a *secondary* symptom — the
                        // <video> element failed first. Prefer the snapshot captured by onerror because
                        // the Player resets the video element before this fires, clearing videoElement.error;
                        // fall back to a live read in case onerror never ran.
                        const mediaError = this._lastMediaError || videoElement.error;
                        if (mediaError) {
                            log(
                                '>>> ROOT CAUSE VIDEO MediaError:',
                                MEDIA_ERROR_NAMES[mediaError.code] || mediaError.code,
                                '(code ' + mediaError.code + ')',
                                'message:',
                                mediaError.message || '(empty)'
                            ).error();
                        }
                        // Prefer the native MediaError for the on-screen alert: when the <video>
                        // element has failed (e.g. PIPELINE_ERROR_DECODE), the Player's onStop error
                        // is usually a downstream symptom ("Append buffer issue"). Show the root cause
                        // and keep the player error as an extra field for context.
                        if (mediaError) {
                            this.setStreamError({
                                type: 'Video',
                                name: MEDIA_ERROR_NAMES[mediaError.code] || 'Media playback error',
                                detail: mediaError.message || undefined,
                                code: mediaError.code,
                                cause: error.name
                            });
                        } else {
                            this.setStreamError(error);
                        }
                    } else {
                        log('onStop').info();
                    }
                    videoElement.muted = this.muted;
                    videoElement.autoplay = true;
                    videoElement.onloadeddata = null;
                    videoElement.onerror = null;

                    this.audioTracks = new Map();
                    this.audioTrack = 'Audio';
                    this.audioTrackId = undefined;
                    this.videoTracks = new Map();
                    this.videoTrack = 'Video';
                    this.videoTrackId = undefined;
                    this.streamMetadata = null;

                    this.player = null;
                    this.playState = PlayState.STOPPED;
                    this.keySystem = null;
                    this.controlsVisible = false;
                    if (this._controlsTimer) { clearTimeout(this._controlsTimer); this._controlsTimer = null; }
                },
                onTrackChange(audioTrack, videoTrack, dataTrack) {
                    log(`onTrackChange ${Util.stringify({audioTrack, videoTrack, dataTrack})}`).info();
                    if(this.videoTrackId != null) {
                        this.videoTrackId = videoTrack;
                    }
                    this.videoTrack = this.videoTracks.get(videoTrack);
                    if(this.audioTrackId != null) {
                        this.audioTrackId = audioTrack;
                    }
                    this.audioTrack = this.audioTracks.get(audioTrack);
                },
                onMetadata(metadata) {
                    log(`onMetadata ${Util.stringify(metadata)}`).info();
                    this.streamMetadata = metadata;

                    this.audioTracks = new Map();
                    this.videoTracks = new Map();

                    for (const [id, track] of metadata.tracks) {

                        if (track.type === Media.Type.VIDEO) {
                            this.videoTracks.set(id, track.toString());
                        } else if (track.type === Media.Type.AUDIO) {
                            this.audioTracks.set(id,track.toString());
                        }
                    }
                },
                selectBottomTab(tab) {
                    this.activeBottomTab = tab;
                    if(tab === 'messages') {
                        this.unreadMessages = 0;
                        this.scrollMessagesToBottom();
                    }
                },
                resetMessages() {
                    this.messages = [];
                    this.unreadMessages = 0;
                    this.activeBottomTab = 'graph';
                },
                formatReceptionTime(date = new Date()) {
                    return date.toLocaleTimeString([], {
                        hour: '2-digit',
                        minute: '2-digit',
                        second: '2-digit'
                    });
                },
                scrollMessagesToBottom() {
                    nextTick(() => {
                        const panel = this.$refs.messagesPanel;
                        if(panel) {
                            panel.scrollTop = panel.scrollHeight;
                        }
                    });
                },
                pushMessage(track, time, data) {
                    const message = Util.stringify(data);
                    this.messages.push({
                        track,
                        receivedAt: this.formatReceptionTime(),
                        text: message.replace(/[\r\n]+/g, ' ')
                    });
                    if(this.messages.length > 200) {
                        this.messages.splice(0, this.messages.length - 200);
                    }
                    if(this.activeBottomTab !== 'messages') {
                        this.unreadMessages += 1;
                    }
                    this.scrollMessagesToBottom();
                },
                mute() {
                    this.muted = !this.muted;
                    this.$refs.video.muted = this.muted;
                    log(this.muted ? 'MutePlayback' : 'UnmutePlayback').info();
                },
                pause() {
                    clearTimeout(this.pauseVideo);
                    this.pauseVideo = null;
                    this.dump();
                    if(this.player) {
                        this.player.paused = !this.player.paused;
                    }
                },
                leaveGoLive(event) {
                    if ((event.buttons & 1) && this.player) {
                        // trick to activate latency
                        this.latencies.push(this.player.latency+"ms");
                    }
                },
                goLive() {
                    if(this.player) {
                        this.player.goLive();
                    }
                },
                resetMetrics(all=false) {
                    this.uiStats.reset();
                    // reset incremental metrics counters
                    if (this.player) {
                        let playerStats = this.player.computeStats();
                        const {skippedAudio, skippedVideo, stallCount} = playerStats;
                        this.deltaStats = { skippedAudio, skippedVideo, stallCount} ;
                    }
                    const displayableCount = all ? 0 : this.uiStats.displayableCount;
                    for(let [_, values] of this.stats) {
                        values.splice(0, Math.max(0, values.length - displayableCount));
                    }
                    this.times.splice(0, Math.max(0, this.times.length - displayableCount));
                    if (all){
                        this.hasMetrics = false;
                        this.deltaStats = {};
                    }
                },
                download(name, data, type) {
                    const url = URL.createObjectURL(new Blob([data], {type}));
                    const link = document.createElement("a");
                    link.setAttribute("href", url);
                    link.setAttribute("download", name);
                    document.body.appendChild(link);
                    link.click();
                    document.body.removeChild(link);
                    URL.revokeObjectURL(url);
                },
                downloadStats() {
                    // Write headers and compute max values
                    let csv = "";
                    let max = this.times.length;
                    let headers = ["localTime" , "mediaTime"];
                    for (const [header, values] of this.stats) {
                        headers.push(header);
                        max = Math.max(max, values.length);
                    }
                    csv = headers.join(';');

                    // Write CSV
                    for (let i = 0; i < max; ++i) {
                        csv += '\n';
                        const {time, mediaTime} = this.times[i];
                        csv += (time || '') + ';' + (mediaTime || '') + ';';
                        for(let [name, stats] of this.stats) {
                            csv += (stats[i] == null ? '' : parseFloat(stats[i])) + ';';
                        }
                    }

                    // Download the csv !
                    this.download("stats.csv", csv, 'text/csv;charset=utf-8;');
                },

                dump() {
                    // Just here to debug binary generation when need
                    if(this.audioDump && this.audioDump.size()) {
                        this.download("audio.mp4", this.audioDump.data(), 'video/mp4');
                    }
                    if(this.videoDump && this.videoDump.size()) {
                        this.download("video.mp4", this.videoDump.data(), 'video/mp4');
                    }
                },
                fullscreen() {
                    const video = this.$refs.video;
                    const target = this.$refs.player; // fullscreen the container so our overlay stays reachable

                    // Already in fullscreen → exit. Prefer the standard exit path.
                    if (document.fullscreenElement || document.webkitFullscreenElement) {
                        (document.exitFullscreen || document.webkitExitFullscreen).call(document);
                        return;
                    }
                    // iOS Safari can only fullscreen the <video> itself (native player UI exits via "Done").
                    if (video && video.webkitDisplayingFullscreen) {
                        video.webkitExitFullscreen && video.webkitExitFullscreen();
                        return;
                    }

                    if (target && target.requestFullscreen) {
                        target.requestFullscreen();
                    } else if (target && target.webkitRequestFullscreen) {
                        target.webkitRequestFullscreen();
                    } else if (video && video.webkitEnterFullscreen) {
                        // iOS Safari fallback: native fullscreen on the video element only.
                        video.webkitEnterFullscreen();
                    }
                },
                activeDrmLabel() {
                    if (!this.keySystem) {
                        return 'Protection';
                    }
                    const drm = this.contentProtection.find(d => this.isDrmActive(d));
                    return drm ? drm.label : 'Protection';
                },
                isPlaying() {
                    return this.playState === PlayState.PLAYING;
                },
                isStarting() {
                    return this.playState === PlayState.STARTING;
                },
                isStopped() {
                    return this.playState === PlayState.STOPPED;
                },
                onVideoTrackChange() {
                    if (this.player) {
                        this.player.videoTrack = this.videoTrackId;
                    }
                },
                onAudioTrackChange() {
                    if (this.player) {
                        this.player.audioTrack = this.audioTrackId;
                    }
                },
                setBuffer(min, max) {
                    let profile;
                    if(!isNaN(min) || !isNaN(max)) {
                        // manual mode
                        profile = this.netProfiles.entries().next().value;
                        this.netProfile = profile[0];
                        profile = profile[1];

                        this.bufferMin = Math.min(min || max, max || min);
                        this.bufferMax = Math.max(min || max, max || min);
                    } else {
                        // auto mode
                        profile = this.netProfiles.get(this.netProfile);
                        if(profile[1]) {
                            this.bufferMin = profile[1];
                        }
                        if(profile[2]) {
                            this.bufferMax = profile[2];
                        }
                    }


                    if (this.player) {
                        // fix possible player correction!
                        this.bufferMin = (this.player.bufferLimitLow = this.bufferMin);
                        this.bufferMax = (this.player.bufferLimitHigh = this.bufferMax);
                    }

                    // Display user description
                    this.netDescription = profile[0];
                    this.netDescription += '<br><strong>Expected buffering ≈ ' + (this.bufferMin + (this.bufferMax-this.bufferMin)/2) + 'ms</strong>';

                    this.updateURL();

                },
                updateURL() {
                    if (history.replaceState) {
                        let path = location.origin + location.pathname + '?stream=' + encodeURIComponent(this.buildStream()) + '&bufferMin=' + this.bufferMin + '&bufferMax=' + this.bufferMax;
                        if(options.token != null) {
                            path += "&token=" + options.token;
                        }
                        if(options.id != null) {
                            path += "&id=" + options.id;
                        }
                        if(options.latency != null) {
                            path += "&latency";
                        }
                        if(options.timeout != null) {
                            path += "&timeout=" + options.timeout;
                        }
                        if (options.cmcd != null) {
                            path += "&cmcd=" + options.cmcd;
                        }
                        if (options.cmcdMode != null) {
                            path += "&cmcdMode=" + options.cmcdMode;
                        }
                        if (options.cmcdSid != null) {
                            path += "&cmcdSid=" + options.cmcdSid;
                        }
                        if(!this.adaptiveFrameSkipping) {
                            path += "&reliable";
                        }
                        if (options.combinable != null && !options.combinable) {
                            console.log("combinable : ", options.combinable);
                            path += "&combinable=false";
                        }
                        if(options.dump) {
                            path += "&dump";
                        }
                        if(options.fixedRate) {
                            path += "&fixedRate";
                        }
                        if(options.debugoverlay) {
                            path += "&debugoverlay";
                        }
                        if(options.host != null) {
                            path += "&host=" + options.host;
                        }
                        const contentProtection = this.serializeContentProtection();
                        if (contentProtection) {
                            path += "&contentProtection=" + utf8ToBase64Url(contentProtection);
                        }
                        // Skip if nothing changed, and use replaceState (not pushState) so settings
                        // tweaks update the address bar in place instead of stacking history entries
                        // the user then has to click back through.
                        if (path === location.href) {
                            return;
                        }
                        history.replaceState({path}, '', path);
                    }
                },
                mutableReliability() {
                    if(this.sourceType === HTTPSource) {
                        // HTTP has no mutable reliability
                        return this.player ? false : true;
                    }
                    return true;
                },
                onReliable() {
                    if (this.player) {
                        this.player.reliable = !this.adaptiveFrameSkipping;
                    }
                    this.updateURL();
                },
                toggleAdaptive() {
                    this.adaptiveFrameSkipping = !this.adaptiveFrameSkipping;
                    this.onReliable();
                }
            },
        }).mount('#main');
    </script>
</html>
